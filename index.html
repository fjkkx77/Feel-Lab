<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手感实验室">
<title>手感实验室</title>
<!--
  手感实验室（Feel-Lab）· sg.wbztl.xyz · fjkkx77/Feel-Lab
  在手机上把常见交互的手感调到自己满意，存进「我的手感库」（同步码多设备同步），以后做新项目第一版直接用。
  设计稿：用户桌面「手感调试工具_设计稿.md」；项目现状见 PROJECT_STATUS.md。
  加到主屏幕全屏打开测得更准：Safari 的地址栏和工具栏会抢手势。
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f86f6'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/sync-panel.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-txt">
      <h1>手感实验室</h1>
      <p>在手机上把手感调到你满意，存进手感库</p>
      <p class="sp-line" id="syncLine" hidden></p>
    </div>
    <button type="button" class="icon-btn lb-press" id="btnLib">手感库</button>
    <button type="button" class="icon-btn lb-press" id="btnSync" aria-label="云同步">☁</button>
  </header>
  <main id="view"></main>
</div>

<!-- 云同步（底部弹窗，能下拉关闭） -->
<div class="mask" id="syncMask" hidden><div class="sheet" id="syncSheet"></div></div>
<!-- 确认框 -->
<div class="mask center" id="askMask" hidden>
  <div class="alert" role="alertdialog" aria-labelledby="askT"><h3 id="askT"></h3><p id="askP"></p>
    <div class="row"><button type="button" class="btn" id="askNo">取消</button><button type="button" class="btn pri" id="askOk">确定</button></div></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="assets/tune-panel.js"></script>
<script src="assets/sync-core.js"></script>
<script src="assets/sync-client.js"></script>
<script src="assets/sync-panel.js"></script>
<script src="assets/sheet-dismiss.js"></script>
<script src="assets/modules.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
